plugins {
    id 'com.android.library'
}

android {
    namespace 'com.necromancer.pybridge'
    compileSdk 36

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    compileOnly 'org.godotengine:godot:4.7.1.stable'
    compileOnly 'com.chaquo.python.runtime:chaquopy_java:17.2.0'
}
